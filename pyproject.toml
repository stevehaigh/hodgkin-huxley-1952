[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hh1952"
version = "0.1.0"
description = "A computational reconstruction of Hodgkin & Huxley (1952)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
notebook = ["jupyter>=1.0", "nbformat>=5.9", "nbconvert>=7.0", "ipykernel>=6.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["hh1952*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
